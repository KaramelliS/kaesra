# Sicil — sabitlenmiş bağımlılık sürümleri
#
# Bu beşli birbirine bağlı. ReAPI sessizce yüklenmiyorsa sebebi neredeyse
# her zaman ReGameDLL sürüm uyuşmazlığıdır; o yüzden hepsi burada yazılı ve
# kurulum betiği bu dosyayı okuyor.
#
# Adreslerin HEPSİ 2026-10-03 tarihinde GitHub Releases API'sinden doğrulandı
# (elle tahmin edilmedi):
#   https://api.github.com/repos/<sahip>/<depo>/releases/tags/<etiket>
#
# Sürüm yükseltirken burayı değiştirin, betiğe dokunmayın.

[amxmodx]
etiket   = 1.10.0.5486
depo     = alliedmodders/amxmodx
# Berkay'ın test ettiği derleme git5479 idi; 5486 aynı dalın güncel sürümü.
# Geri dönmek isterseniz etiketi 1.10.0.5479 yapın — ad şeması aynı.
windows  = amxmodx-%s-base-windows.zip amxmodx-%s-cstrike-windows.zip
linux    = amxmodx-%s-base-linux.tar.gz amxmodx-%s-cstrike-linux.tar.gz
lisans   = GPL-3.0
aciklama = AMX Mod X (base + cstrike)

[rehlds]
etiket   = 3.15.0.896
depo     = rehlds/ReHLDS
dosya    = rehlds-bin-%s.zip
lisans   = GPL-3.0
aciklama = ReHLDS — motor
# TUZAK: pakette bin/win32/ altında tam bir ikili takım var ama YALNIZ
# swds.dll kopyalanacak. hlds.exe de kopyalanırsa sunucu
# 'Assertion Failed: Failed to load "SDL3.dll"' deyip donuyor; Steam'in
# steam_legacy dalı SDL2 ile geliyor.

[regamedll]
etiket   = 5.30.0.814
depo     = rehlds/ReGameDLL_CS
dosya    = regamedll-bin-%s.zip
lisans   = GPL-3.0
aciklama = ReGameDLL_CS — oyun dll'i

[metamod]
etiket   = 1.3.0.149
depo     = rehlds/Metamod-R
dosya    = metamod-bin-%s.zip
lisans   = GPL-2.0
aciklama = Metamod-R
# Kurulumdan sonra cstrike/liblist.gam içinde:
#   gamedll "addons\metamod\metamod.dll"
#   gamedll_linux "addons/metamod/metamod_i386.so"
# TUZAK: 'steamcmd validate' bu dosyayı ve mp.dll'i varsayılana döndürüyor.
# Validate yaptıktan sonra bu iki değişikliği yeniden uygulayın.

[reapi]
etiket   = 5.29.0.358
depo     = rehlds/ReAPI
dosya    = reapi-bin-%s.zip
lisans   = GPL-3.0
aciklama = ReAPI — sicil.sma'nın hook zincirleri buradan

[easyhttp]
etiket   = 1.5.0
depo     = Next21Team/AmxxEasyHttp
windows  = AmxxEasyHttp-%s-windows-win32.zip
linux    = AmxxEasyHttp-%s-linux-i386.zip
lisans   = GPL-3.0
aciklama = AmxxEasyHttp — senkron katmanının HTTP istemcisi

[hlds]
# SteamCMD ile: app 90, steam_legacy dalı. Sürüm numarası yok, dal sabitleniyor.
uygulama = 90
dal      = steam_legacy
aciklama = Counter-Strike 1.6 dedicated (HLDS)
