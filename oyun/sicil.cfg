// Sicil ayarları.
//
// Bu dosya server.cfg'nin SONUNDAN exec ediliyor:
//
//   exec addons/amxmodx/configs/sicil.cfg
//
// amxx.cfg'ye koymayın: bazı hlds kurulumları AMXX'in kendi amxx.cfg
// dosyasını çalıştıramıyor ve oraya eklenen satır hiç işlenmiyor.

// Web servisinin kök adresi, sonunda / olmadan.
sicil_api "http://127.0.0.1:8130"

// Sunucu ile web servisi arasındaki paylaşılan anahtar.
//
// Üretmek için:  php sunucu/anahtar-uret.php
// Çıkan 64 haneli değeri buraya ve sunucu tarafındaki anahtar.txt dosyasına
// yazın — ikisi birebir aynı olmalı. Boş bırakılırsa eklenti çalışmaya
// devam eder (komutlar ve MOTD sayfaları açılır) ama web servisine veri
// göndermez.
sicil_anahtar ""

// 1 ise gönderilen parti gövdesi ve her komut konsola yazılır.
// Sorun giderirken açın, normal kullanımda kapatın: sohbet satırı başına
// bir konsol satırı demek ve günlük dosyası hızlı büyüyor.
sicil_gunluk 0

// Sohbette oyuncu adının önünde rütbesi görünsün mü?
sicil_sohbet_etiketi 1

// Sohbet ve HUD çıkış kodlaması.
//   0 UTF-8   — yeni istemciler (GoldSrc UTF-8 yaması, NextClient)
//   1 CP1254  — eski/vanilla istemci, Türkçe karakterler tek bayt çizilir
//   2 ASCII   — Türkçe karakterleri tamamen atar, en güvenli seçenek
// Yanlış seçilirse sohbet "ÅŸ" gibi görünür; sicil_durum ile doğrulayın.
sicil_sohbet_kodlama 0

// Botların istatistiği tutulsun mu? Yalnız test için.
// Botların SteamID'si olmadığı için verileri web'e gönderilemez; bu
// ayar yalnız oyun içi sayaçları ve /rank çıktısını denemenizi sağlar.
sicil_botlari_say 0

// Beraberlikte maç uzasın mı? 1 ise 12-12'de maç 13'te bitmez,
// iki fark aranır (14-12, 15-13, ...).
sicil_uzatma 1
